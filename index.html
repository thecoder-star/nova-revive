    <script>
      // Force WebSocket Keep-Alive to bypass school proxy packet drops
      (function() {
        const nativeWS = window.WebSocket;
        if (nativeWS) {
          window.WebSocket = function(url, protocols) {
            const ws = new nativeWS(url, protocols);
            let pingInterval;
            ws.addEventListener('open', () => {
              // Send heartbeat every 15 seconds to keep school filters from killing the connection
              pingInterval = setInterval(() => {
                if (ws.readyState === 1) {
                  ws.send(JSON.stringify({ type: 'ping' }));
                }
              }, 15000);
            });
            ws.addEventListener('close', () => clearInterval(pingInterval));
            ws.addEventListener('error', () => clearInterval(pingInterval));
            return ws;
          };
        }
      })();
