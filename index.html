<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Force WebSocket Keep-Alive to prevent school filters from killing Supabase Realtime
      (function() {
        const nativeWS = window.WebSocket;
        if (nativeWS) {
          window.WebSocket = function(url, protocols) {
            const ws = new nativeWS(url, protocols);
            let pingInterval;
            ws.addEventListener('open', () => {
              pingInterval = setInterval(() => {
                if (ws.readyState === 1) {
                  ws.send(JSON.stringify({ type: 'ping' }));
                }
              }, 15000);
            });
            ws.addEventListener('close', () => clearInterval(pingInterval));
            ws.addEventListener('error', () => clearInterval(pingInterval));
            return ws;
          };
        }
      })();
    </script>
    <script type="module" crossorigin>
      // External bundle dynamic loader
      (function(){
        const e=document.createElement("link").relList;
        if(e&&e.supports&&e.supports("modulepreload"))return;
        for(const s of document.querySelectorAll('link[rel="modulepreload"]'))o(s);
        new MutationObserver(s=>{
          for(const l of s)
            if(l.type==="childList")
              for(const c of l.addedNodes)
                c.tagName==="LINK"&&c.rel==="modulepreload"&&o(c)
        }).observe(document,{childList:!0,subtree:!0});
        function i(s){
          const l={};
          if(s.integrity)l.integrity=s.integrity;
          if(s.referrerPolicy)l.referrerPolicy=s.referrerPolicy;
          s.crossOrigin==="use-credentials"?l.credentials="include":s.crossOrigin==="anonymous"?l.credentials="omit":l.credentials="same-origin";
          return l;
        }
        function o(s){
          if(s.ep)return;
          s.ep=!0;
          const l=i(s);
          fetch(s.href,l);
        }
      })();
    </script>
    <!-- Load CDN App Bundle -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/thecoder-star/nova-revive@main/index.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
